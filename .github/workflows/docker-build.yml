name: Build Fluxo Ti

on:
  push:
    tags: ['v*']
  workflow_dispatch:

env:
  REGISTRY: ghcr.io

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      
      - name: Build and push
        run: |
          docker build -t ghcr.io/axxia25/fluxoti:latest .
          docker tag ghcr.io/axxia25/fluxoti:latest ghcr.io/axxia25/fluxoti:v4.7.0-axxia.1
          docker push ghcr.io/axxia25/fluxoti:latest
          docker push ghcr.io/axxia25/fluxoti:v4.7.0-axxia.1
